<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VideoMaster (Safari版)</title>
<style>
  body{background:#0f1724;color:#e6eef6;font-family:system-ui;margin:0;padding:10px}
  [data-theme="light"]{background:#f5f5f5;color:#222}
  button{padding:6px 10px;border:none;border-radius:6px;cursor:pointer;margin:2px}
  ul{list-style:none;padding:0}
  li{margin:4px 0;padding:4px;background:rgba(255,255,255,0.1);border-radius:4px}
</style>
</head>
<body>
<h1>VideoMaster</h1>
<button id="themeToggle">🌗テーマ切替</button>
<input type="file" id="fileInput" accept="audio/*" multiple>
<audio id="player" controls style="width:100%;margin-top:10px"></audio>
<ul id="list"></ul>
<script>
const p=document.getElementById('player');
const f=document.getElementById('fileInput');
const l=document.getElementById('list');
let files=[];let i=0;
f.onchange=e=>{
 files=[...e.target.files];l.innerHTML='';
 files.forEach((x,idx)=>{
   const li=document.createElement('li');
   li.textContent=x.name;
   li.onclick=()=>{i=idx;play();};
   l.append(li);
 });
};
function play(){
 if(!files[i])return;
 const r=new FileReader();
 r.onload=()=>{p.src=r.result;p.play();}
 r.readAsDataURL(files[i]);
}
p.onended=()=>{i=(i+1)%files.length;play();}
document.getElementById('themeToggle').onclick=()=>{
 const t=document.body.dataset.theme==='light'?'dark':'light';
 document.body.dataset.theme=t;
};
</script>
</body>
</html>
